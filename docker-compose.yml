services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: lirandzo-postgres
    environment:
      POSTGRES_DB: lirandzo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./lirandzo-backend/scripts/init-database.sql:/docker-entrypoint-initdb.d/init-database.sql
    networks:
      - lirandzo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Spring Boot Backend (opcional - pode correr localmente também)
  backend:
    build:
      context: ./lirandzo-backend
      dockerfile: Dockerfile
    container_name: lirandzo-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lirandzo_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lirandzo-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  lirandzo-network:
    driver: bridge
