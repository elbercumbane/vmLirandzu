# Configuração para ambiente de produção
# Para usar: mvn spring-boot:run -Dspring-boot.run.profiles=prod
# OU definir variável de ambiente: SPRING_PROFILES_ACTIVE=prod

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# PostgreSQL Database Configuration (Produção)
# IMPORTANTE: Usar variáveis de ambiente ou secrets management
# Exemplo: spring.datasource.url=${DB_URL}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:lirandzo_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration (Produção)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool Configuration (Produção - valores maiores)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Logging Configuration (menos verboso em produção)
logging.level.root=WARN
logging.level.com.lirandzo=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# CORS Configuration (Produção - ajustar para domínio real)
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Africa/Maputo

# Security (em produção, configurar adequadamente)
# spring.security.user.name=admin
# spring.security.user.password=${ADMIN_PASSWORD}
