# =============================================================================
# Profile prod — Postgres no SERVIDOR (VPS/cloud). Não é a base do teu PC.
# =============================================================================
# Obrigatório definir SPRING_DATASOURCE_URL (e user/password) no ambiente de deploy.
# Para correr localmente continua com SPRING_PROFILES_ACTIVE=dev.
#
# Activar: SPRING_PROFILES_ACTIVE=prod

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# --- Base de dados SERVIDOR ---
# Opção A (recomendada): URL JDBC completa (PaaS, secrets, Docker com URL fixa)
#   SPRING_DATASOURCE_URL=jdbc:postgresql://hostname:5432/lirandzo_db
#   SPRING_DATASOURCE_USERNAME=...
#   SPRING_DATASOURCE_PASSWORD=...
#
# Opção B: host e porta em variáveis (útil em compose ou VPS)
#   DB_HOST=... DB_PORT=5432 DB_NAME=lirandzo_db
#   DB_USERNAME=... DB_PASSWORD=...
#
# Se SPRING_DATASOURCE_URL estiver definida, ignora-se a construção por DB_*.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lirandzo_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:admin}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration (Produção)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool Configuration (Produção - valores maiores)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Logging Configuration (menos verboso em produção)
logging.level.root=WARN
logging.level.com.lirandzo=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# CORS (Produção): origens do frontend separadas por vírgula. Ex.: CORS_ALLOWED_ORIGINS=https://app.vercel.app,http://localhost:4200
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,https://lirandzo-app-nine.vercel.app}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Africa/Maputo

# Security (em produção, configurar adequadamente)
# spring.security.user.name=admin
# spring.security.user.password=${ADMIN_PASSWORD}
