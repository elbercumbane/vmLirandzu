# Spring Profiles
# For development: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# For production: mvn spring-boot:run -Dspring-boot.run.profiles=prod
# Or set variable: SPRING_PROFILES_ACTIVE=dev|prod
spring.profiles.active=dev

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# PostgreSQL Database Configuration (porta 5432 = padrao; use 5433 se o teu PostgreSQL usar)
spring.datasource.url=jdbc:postgresql://localhost:5433/lirandzo_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# Logging Configuration
logging.level.root=INFO
logging.level.com.lirandzo=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# CORS Configuration (allow Angular frontend communication)
spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Africa/Maputo
