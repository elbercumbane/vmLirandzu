# Spring Profiles
#   dev  = máquina local (ver application-dev.properties)
#   prod = servidor / produção (ver application-prod.properties)
# Activar: SPRING_PROFILES_ACTIVE=dev|prod
#   ou: mvn spring-boot:run -Dspring-boot.run.profiles=dev
spring.profiles.active=dev

# Server Configuration (fallback se o profile não definir porta)
server.port=8080
server.servlet.context-path=/api

# PostgreSQL — valores por defeito só quando nenhum profile carrega datasource específico.
# Em uso normal, dev e prod trazem cada um a sua ligação (local vs servidor).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lirandzo_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# Logging Configuration
logging.level.root=INFO
logging.level.com.lirandzo=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# CORS Configuration (allow Angular frontend communication)
spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Africa/Maputo
