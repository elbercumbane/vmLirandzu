# Configuração para ambiente de desenvolvimento
# Para usar: mvn spring-boot:run -Dspring-boot.run.profiles=dev

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# PostgreSQL Database Configuration (Desenvolvimento Local)
spring.datasource.url=jdbc:postgresql://localhost:5432/lirandzo_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# Debug: Log datasource configuration
logging.level.org.springframework.boot.autoconfigure.jdbc.DataSourceProperties=DEBUG
logging.level.com.zaxxer.hikari=DEBUG

# Logging Configuration (mais verboso em dev)
logging.level.root=INFO
logging.level.com.lirandzo=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:4200,http://localhost:4201
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Africa/Maputo
