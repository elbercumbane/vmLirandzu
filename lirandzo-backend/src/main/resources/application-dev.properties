# =============================================================================
# Profile dev — Postgres na TUA máquina (não é o servidor de produção).
# =============================================================================
# Por defeito: Postgres instalado no Windows (porta 5432), como no instalador oficial.
# Docker Compose na raiz do repo mapeia Postgres para o host em 5433; nesse caso:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5433/lirandzo_db
#
# Servidor / VPS: profile prod (application-prod.properties + variáveis).

# Server Configuration
server.port=8081
server.servlet.context-path=/api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lirandzo_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# Debug: Log datasource configuration
logging.level.org.springframework.boot.autoconfigure.jdbc.DataSourceProperties=DEBUG
logging.level.com.zaxxer.hikari=DEBUG

# Logging Configuration (mais verboso em dev)
logging.level.root=INFO
logging.level.com.lirandzo=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:4200,http://localhost:4201
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Africa/Maputo
