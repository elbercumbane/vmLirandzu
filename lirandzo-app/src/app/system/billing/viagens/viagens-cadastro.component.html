<app-billing-section-header
  [showBack]="true"
  [backLink]="'/billing/viagens'"
  [showHelp]="true"
  title="Nova Viagem / Guia de Remessa"
  subtitle="Registe a viagem e associe as cargas de vários clientes"
  helpTitle="Como registar uma Viagem / Guia"
  [helpItems]="[
    'Escolha o motorista e a viatura responsáveis pela viagem.',
    'Defina origem, destino, datas e os dados principais da rota.',
    'Adicione todas as cargas (clientes, produtos e referências de encomenda) que vão nesta viagem.'
  ]"
></app-billing-section-header>

<div class="card">
  <!-- Atribuição -->
  <h3 class="form-section-title">Atribuição</h3>
  <div class="form-grid">
    <div class="form-group">
      <label class="form-label">Motorista</label>
      <select class="form-control" [(ngModel)]="viagem.motoristaId">
        <option [value]="null">Seleccionar...</option>
        <option *ngFor="let m of motoristas" [value]="m.id">{{ m.nome }} {{ m.telefone ? '(' + m.telefone + ')' : '' }}</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Viatura</label>
      <select class="form-control" [(ngModel)]="viagem.viaturaId">
        <option [value]="null">Seleccionar...</option>
        <option *ngFor="let v of viaturas" [value]="v.id">{{ v.matricula }} ({{ v.marca }} {{ v.modelo }})</option>
      </select>
    </div>
  </div>

  <!-- Rota -->
  <h3 class="form-section-title">Rota</h3>
  <div class="form-grid">
    <div class="form-group">
      <label class="form-label">Origem</label>
      <input type="text" class="form-control" [(ngModel)]="viagem.origem" placeholder="Ex: Maputo">
    </div>
    <div class="form-group">
      <label class="form-label">Destino</label>
      <input type="text" class="form-control" [(ngModel)]="viagem.destino" placeholder="Ex: Tete">
    </div>
    <div class="form-group">
      <label class="form-label">Data de Saída</label>
      <input type="date" class="form-control" [(ngModel)]="viagem.dataSaida">
    </div>
    <div class="form-group">
      <label class="form-label">Data Chegada Prevista</label>
      <input type="date" class="form-control" [(ngModel)]="viagem.dataChegadaPrevista">
    </div>
  </div>

  <!-- Cargas / Produtos -->
  <h3 class="form-section-title">Cargas / Produtos</h3>
  <div class="cargas-list">
    <div class="cargo-card" *ngFor="let carga of cargas; let i = index">
      <div class="cargo-card-header">
        <span class="cargo-card-title">Carga {{ i + 1 }}</span>
        <button type="button" class="cargo-remove-btn" (click)="removerCarga(i)" *ngIf="cargas.length > 1" title="Remover carga">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Cliente</label>
          <input type="text" class="form-control" [(ngModel)]="carga.cliente" placeholder="Nome do cliente">
        </div>
        <div class="form-group">
          <label class="form-label">Descrição</label>
          <input type="text" class="form-control" [(ngModel)]="carga.descricao" placeholder="Ex: Full load, sacos...">
        </div>
        <div class="form-group">
          <label class="form-label">Quantidade</label>
          <input type="number" class="form-control" [(ngModel)]="carga.quantidade" min="1" placeholder="1">
        </div>
        <div class="form-group">
          <label class="form-label">Peso Estimado</label>
          <input type="text" class="form-control" [(ngModel)]="carga.peso" placeholder="Ex: 20 ton">
        </div>
        <div class="form-group">
          <label class="form-label">Ref. Encomenda</label>
          <input type="text" class="form-control" [(ngModel)]="carga.encomendaRef" placeholder="Ex: 108D">
        </div>
        <div class="form-group">
          <label class="form-label">Observação</label>
          <input type="text" class="form-control" [(ngModel)]="carga.observacao" placeholder="Notas adicionais">
        </div>
      </div>
    </div>
  </div>
  <button type="button" class="btn-secondary" (click)="adicionarCarga()" style="margin-top: 0.75rem">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    Adicionar Carga
  </button>

  <!-- Observações -->
  <h3 class="form-section-title">Observações</h3>
  <div class="form-grid">
    <div class="form-group full-width">
      <label class="form-label">Observações da Viagem</label>
      <textarea class="form-control" [(ngModel)]="viagem.observacoes" placeholder="Notas gerais sobre a viagem..." rows="3"></textarea>
    </div>
  </div>

  <div class="form-actions">
    <a routerLink="/billing/viagens" class="btn-secondary">Cancelar</a>
    <button type="button" class="btn-primary" (click)="salvar()" [disabled]="loading">
      @if (loading) {
        Guardando...
      } @else {
        Guardar Viagem
      }
    </button>
  </div>
</div>

<app-notification-popup
  *ngIf="showNotification"
  [message]="notificationMessage"
  [type]="notificationType"
  [duration]="7000">
</app-notification-popup>
