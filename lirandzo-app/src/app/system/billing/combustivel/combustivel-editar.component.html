<app-billing-section-header [showBack]="true" [backLink]="'/billing/combustivel'" title="Editar Abastecimento" subtitle="Alterar dados do abastecimento"></app-billing-section-header>

@if (loading) {
  <div class="loading-state"><p>A carregar...</p></div>
} @else if (abastecimento) {
  <div class="card">
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Data *</label>
        <input type="date" class="form-control" [(ngModel)]="form.refuelDate" name="refuelDate" required>
      </div>
      <div class="form-group">
        <label class="form-label">Viatura *</label>
        <select class="form-control" [(ngModel)]="form.vehicleId" name="vehicleId" required>
          <option [ngValue]="null">Seleccionar...</option>
          @for (v of viaturas; track v.id) {
            <option [ngValue]="v.id">{{ v.matricula }} — {{ v.marca }} {{ v.modelo }}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Litros *</label>
        <input type="number" class="form-control" [(ngModel)]="form.liters" name="liters" min="0.01" step="0.01" required>
      </div>
      <div class="form-group">
        <label class="form-label">Custo (MZN) *</label>
        <input type="number" class="form-control" [(ngModel)]="form.cost" name="cost" min="0" required>
      </div>
      <div class="form-group">
        <label class="form-label">Quilometragem</label>
        <input type="number" class="form-control" [(ngModel)]="form.kmReading" name="kmReading" min="0">
      </div>
      <div class="form-group">
        <label class="form-label">Posto</label>
        <input type="text" class="form-control" [(ngModel)]="form.station" name="station">
      </div>
      <div class="form-group full-width">
        <label class="form-label">Notas</label>
        <textarea class="form-control" [(ngModel)]="form.notes" name="notes" rows="2"></textarea>
      </div>
    </div>
    <div class="form-actions">
      <a routerLink="/billing/combustivel" class="btn-secondary">Cancelar</a>
      <button type="button" class="btn-primary" (click)="guardar()" [disabled]="loadingForm">{{ loadingForm ? 'A guardar...' : 'Guardar' }}</button>
    </div>
  </div>
  <app-notification-popup *ngIf="showNotification" [message]="notificationMessage" [type]="notificationType" [duration]="3000"></app-notification-popup>
} @else {
  <div class="error-state"><p>Abastecimento não encontrado.</p><a routerLink="/billing/combustivel" class="btn-secondary">Voltar</a></div>
}
