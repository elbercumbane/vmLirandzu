<app-billing-section-header
  [showBack]="true"
  [backLink]="'/billing/ocorrencias'"
  [showHelp]="true"
  title="Editar Ocorrência"
  subtitle="Alterar dados da ocorrência"
  helpTitle="Edição de Ocorrência"
  [helpItems]="[
    'Altere o estado (Aberto, Em Reparação, Resolvido) consoante o progresso.',
    'Pode actualizar o custo estimado quando tiver valores finais.',
    'As alterações ao impacto na viatura actualizam o status da viatura.'
  ]"
></app-billing-section-header>

@if (loading) {
  <div class="loading-state">
    <p>A carregar ocorrência...</p>
  </div>
} @else if (error || !ocorrencia) {
  <div class="error-state">
    <p>{{ error || 'Ocorrência não encontrada.' }}</p>
    <a routerLink="/billing/ocorrencias" class="btn-secondary">Voltar às Ocorrências</a>
  </div>
} @else {
  <div class="card">
    <h3 class="form-section-title" style="margin-top: 0">Dados da Ocorrência</h3>
    <p class="form-hint">Viatura: {{ ocorrencia.vehiclePlate }} — {{ ocorrencia.vehicleName }}</p>

    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Data *</label>
        <input type="date" class="form-control" [(ngModel)]="form.data" name="data" required>
      </div>
      <div class="form-group">
        <label class="form-label">Viatura *</label>
        <select class="form-control" [(ngModel)]="form.vehicleId" name="vehicleId" required>
          <option [ngValue]="null">Seleccionar...</option>
          @for (v of viaturas; track v.id) {
            <option [ngValue]="v.id">{{ v.matricula }} — {{ v.marca }} {{ v.modelo }}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Motorista {{ form.tipo === 'ACIDENTE' ? '*' : '' }}</label>
        <select class="form-control" [(ngModel)]="form.driverId" [required]="form.tipo === 'ACIDENTE'" name="driverId">
          <option [ngValue]="null">Seleccionar...</option>
          @for (m of motoristas; track m.id) {
            <option [ngValue]="m.id">{{ m.nome }}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Tipo *</label>
        <select class="form-control" [(ngModel)]="form.tipo" name="tipo" required>
          <option value="">Seleccionar...</option>
          <option value="AVARIA">Avaria</option>
          <option value="ACIDENTE">Acidente</option>
          <option value="MANUTENCAO">Manutenção</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Estado da viatura *</label>
        <select class="form-control" [(ngModel)]="form.impactoVeiculo" name="impactoVeiculo" required>
          <option value="">Seleccionar...</option>
          <option value="OPERACIONAL">Operacional</option>
          <option value="EM_REPARACAO">Em Reparação</option>
          <option value="PERDA_TOTAL">Perda Total</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Estado da ocorrência *</label>
        <select class="form-control" [(ngModel)]="form.status" name="status" required>
          <option value="">Seleccionar...</option>
          <option value="ABERTO">Aberto</option>
          <option value="EM_REPARACAO">Em Reparação</option>
          <option value="RESOLVIDO">Resolvido</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Gravidade</label>
        <select class="form-control" [(ngModel)]="form.gravidade" name="gravidade">
          <option value="">Seleccionar...</option>
          <option value="BAIXA">Baixa</option>
          <option value="MEDIA">Média</option>
          <option value="ALTA">Alta</option>
          <option value="CRITICA">Crítica</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Custo Estimado (MZN)</label>
        <input type="number" class="form-control" [(ngModel)]="form.custoEstimado" name="custoEstimado" placeholder="0" min="0">
      </div>
      <div class="form-group full-width">
        <label class="form-label">Descrição *</label>
        <textarea class="form-control" [(ngModel)]="form.descricao" name="descricao" rows="4" required></textarea>
      </div>
    </div>

    <div class="form-actions">
      <a routerLink="/billing/ocorrencias" class="btn-secondary">Cancelar</a>
      <button type="button" class="btn-primary" (click)="guardar()" [disabled]="loadingForm">
        {{ loadingForm ? 'A guardar...' : 'Guardar Alterações' }}
      </button>
    </div>
  </div>

  <app-notification-popup
    *ngIf="showNotification"
    [message]="notificationMessage"
    [type]="notificationType"
    [duration]="3000">
  </app-notification-popup>
}
