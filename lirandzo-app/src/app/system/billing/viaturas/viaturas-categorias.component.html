<a routerLink="/billing/viaturas" class="btn-back">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path d="M19 12H5M12 19l-7-7 7-7"/>
  </svg>
  Voltar
</a>

<div class="page-header">
  <div class="page-header-left">
    <h1>Categorias de Viaturas</h1>
    <p>Gerir tipos de viaturas</p>
  </div>
</div>

<div class="card">
  <div class="cat-add-row">
    <input type="text" class="form-control" placeholder="Nome da categoria" [(ngModel)]="novaCategoria" (keyup.enter)="adicionarCategoria()">
    <button type="button" class="btn-primary" (click)="adicionarCategoria()">Adicionar</button>
  </div>

  <div class="cat-list">
    @for (cat of categorias; track cat.id) {
      <div class="cat-item">
        @if (editandoId === cat.id) {
          <div class="cat-edit-row">
            <input type="text" class="form-control" [(ngModel)]="editandoNome" (keyup.enter)="salvarEdicao(cat)">
            <button type="button" class="btn-primary" (click)="salvarEdicao(cat)">Guardar</button>
            <button type="button" class="btn-secondary" (click)="cancelarEdicao()">Cancelar</button>
          </div>
        } @else {
          <span class="cat-name">{{ cat.nome }}</span>
        }
        <span class="cat-desc">{{ cat.descricao }}</span>
        <span class="cat-count">
          <span class="badge badge-neutral">{{ cat.totalViaturas }} viaturas</span>
        </span>
        @if (editandoId !== cat.id) {
          <div class="cat-actions">
            <button type="button" class="action-btn" (click)="iniciarEdicao(cat)" title="Editar">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
            <button type="button" class="action-btn action-btn-danger" (click)="removerCategoria(cat.id)" title="Remover">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                <line x1="10" y1="11" x2="10" y2="17"/>
                <line x1="14" y1="11" x2="14" y2="17"/>
              </svg>
            </button>
          </div>
        }
      </div>
    }
  </div>
</div>
