<app-billing-section-header
  [showBack]="true"
  [backLink]="'/billing/manutencao'"
  [showHelp]="true"
  title="Registrar Manutenção"
  subtitle="Registo de manutenção preventiva ou correctiva"
  helpTitle="Manutenção"
  [helpItems]="['Selecione viatura, tipo, data e descrição. Custo e peças substituídas são opcionais.']"
></app-billing-section-header>

<div class="card">
  <form (ngSubmit)="salvar()">
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Data *</label>
        <input type="date" class="form-control" [(ngModel)]="form.maintenanceDate" name="maintenanceDate" required>
      </div>
      <div class="form-group">
        <label class="form-label">Viatura *</label>
        <select class="form-control" [(ngModel)]="form.vehicleId" name="vehicleId" required>
          <option [ngValue]="null">Seleccionar...</option>
          @for (v of viaturas; track v.id) {
            <option [ngValue]="v.id">{{ v.matricula }} — {{ v.marca }} {{ v.modelo }}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Tipo *</label>
        <select class="form-control" [(ngModel)]="form.type" name="type" required>
          @for (t of tipos; track t.value) {
            <option [value]="t.value">{{ t.label }}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Custo (MZN)</label>
        <input type="number" class="form-control" [(ngModel)]="form.cost" name="cost" min="0" placeholder="Opcional">
      </div>
      <div class="form-group">
        <label class="form-label">Quilometragem</label>
        <input type="number" class="form-control" [(ngModel)]="form.kmReading" name="kmReading" min="0" placeholder="Opcional">
      </div>
      <div class="form-group">
        <label class="form-label">Oficina</label>
        <input type="text" class="form-control" [(ngModel)]="form.workshop" name="workshop" placeholder="Ex: Auto-Serviço Matola">
      </div>
      <div class="form-group full-width">
        <label class="form-label">Descrição *</label>
        <textarea class="form-control" [(ngModel)]="form.description" name="description" rows="3" required placeholder="Descreva a manutenção realizada"></textarea>
      </div>
      <div class="form-group full-width">
        <label class="form-label">Peças substituídas</label>
        <input type="text" class="form-control" [(ngModel)]="form.partsReplaced" name="partsReplaced" placeholder="Ex: Filtro de óleo, pastilhas de travão">
      </div>
    </div>
    <div class="form-actions">
      <a routerLink="/billing/manutencao" class="btn-secondary">Cancelar</a>
      <button type="submit" class="btn-primary" [disabled]="loadingForm">{{ loadingForm ? 'A guardar...' : 'Registar' }}</button>
    </div>
  </form>
</div>

<app-notification-popup *ngIf="showNotification" [message]="notificationMessage" [type]="notificationType" [duration]="3000"></app-notification-popup>
