<div class="page-top-row">
  <div class="page-header-left">
    <h1>Nova Viatura</h1>
    <p>Registar nova viatura na frota</p>
  </div>
  <a routerLink="/billing/viaturas" class="btn-back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    Voltar
  </a>
</div>

<div class="card">
  <form (ngSubmit)="salvar()">
    <div class="form-section-title">Identificação</div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Matrícula</label>
        <input type="text" class="form-control" placeholder="Ex: MDD-45-78" [(ngModel)]="viatura.matricula" name="matricula">
      </div>
      <div class="form-group">
        <label class="form-label">Marca</label>
        <input type="text" class="form-control" placeholder="Ex: Volvo, Scania" [(ngModel)]="viatura.marca" name="marca">
      </div>
      <div class="form-group">
        <label class="form-label">Modelo</label>
        <input type="text" class="form-control" placeholder="Ex: FH16, R450" [(ngModel)]="viatura.modelo" name="modelo">
      </div>
      <div class="form-group">
        <label class="form-label">Tipo</label>
        <select class="form-control" [(ngModel)]="viatura.tipo" name="tipo">
          <option value="">Seleccionar tipo</option>
          @for (t of tiposViatura; track t) {
            <option [value]="t">{{ t }}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Ano</label>
        <input type="number" class="form-control" placeholder="Ex: 2022" [(ngModel)]="viatura.ano" name="ano">
      </div>
      <div class="form-group">
        <label class="form-label">Cor</label>
        <input type="text" class="form-control" placeholder="Ex: Branco, Azul" [(ngModel)]="viatura.cor" name="cor">
      </div>
    </div>

    <div class="form-section-title">Informações Técnicas</div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Chassi</label>
        <input type="text" class="form-control" placeholder="Número de chassi" [(ngModel)]="viatura.chassi" name="chassi">
      </div>
      <div class="form-group">
        <label class="form-label">KM Actual</label>
        <input type="number" class="form-control" placeholder="Quilometragem actual" [(ngModel)]="viatura.kmActual" name="kmActual">
      </div>
      <div class="form-group">
        <label class="form-label">Capacidade de Carga (ton)</label>
        <input type="number" class="form-control" placeholder="Ex: 25" [(ngModel)]="viatura.capacidadeCarga" name="capacidadeCarga">
      </div>
      <div class="form-group">
        <label class="form-label">Consumo Médio (L/100km)</label>
        <input type="number" class="form-control" placeholder="Ex: 32" [(ngModel)]="viatura.consumoMedio" name="consumoMedio">
      </div>
    </div>

    <div class="form-section-title">Observações</div>
    <div class="form-group full-width">
      <label class="form-label">Observações</label>
      <textarea class="form-control" placeholder="Notas adicionais sobre a viatura..." [(ngModel)]="viatura.observacoes" name="observacoes" rows="4"></textarea>
    </div>

    <h3 class="form-section-title">Foto da Viatura</h3>
    <div class="foto-upload-area">
      <div class="foto-preview" *ngIf="fotoPreview">
        <img [src]="fotoPreview" alt="Preview da viatura">
        <button type="button" class="foto-remove-btn" (click)="removerFoto()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <label class="foto-upload-label" *ngIf="!fotoPreview">
        <input type="file" accept="image/*" (change)="onFotoSelected($event)" hidden>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <span>Clique para adicionar foto da viatura</span>
        <small>JPG, PNG — máx 5MB</small>
      </label>
    </div>

    <div class="form-actions">
      <a routerLink="/billing/viaturas" class="btn-secondary">Cancelar</a>
      <button type="submit" class="btn-primary">Salvar Viatura</button>
    </div>
  </form>
</div>
