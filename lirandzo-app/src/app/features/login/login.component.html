<main class="login-page">
  <div class="login-bg"></div>
  <div class="login-overlay"></div>

  <header class="login-header">
    <a routerLink="/" class="login-brand">
      <span class="login-logo-mark">VM</span>
      <span class="login-logo-name">Lirandzo<br><em>Transportes</em></span>
    </a>
    <a routerLink="/" class="login-portal-link">← Voltar para o portal</a>
  </header>

  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <span class="login-logo-mark">VM</span>
      </div>
      <h1 class="login-title">Lirandzo</h1>
      <p class="login-subtitle">Fleet Hub — VM Transportes</p>
      <p class="login-instruction">Seleccione o perfil para aceder ao sistema</p>

      <div class="login-roles">
        <button type="button" class="login-role-btn role-admin" (click)="loginAs('admin')">
          <div class="role-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
          </div>
          <div class="role-info">
            <div class="role-name">Administrador</div>
            <div class="role-desc">Acesso total: gerir contas, aprovar pagamentos, registar gestores e técnicos</div>
          </div>
        </button>

        <button type="button" class="login-role-btn role-gestor" (click)="loginAs('gestor')">
          <div class="role-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
              <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"></path>
            </svg>
          </div>
          <div class="role-info">
            <div class="role-name">Gestor</div>
            <div class="role-desc">Aprovar pagamentos, registar técnicos, desativar contas, gerar relatórios</div>
          </div>
        </button>

        <button type="button" class="login-role-btn role-tecnico" (click)="loginAs('tecnico')">
          <div class="role-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
            </svg>
          </div>
          <div class="role-info">
            <div class="role-name">Técnico</div>
            <div class="role-desc">Registar facturas, cadastrar viaturas, motoristas e viagens</div>
          </div>
        </button>
      </div>

      <a routerLink="/recuperar-senha" class="login-forgot-link">Esqueceu a senha?</a>
    </div>

    <div class="login-info">
      <p class="login-sim-note">Modo de simulação — os perfis permitem testar as diferentes permissões do sistema sem necessidade de backend.</p>
    </div>
  </div>
</main>
