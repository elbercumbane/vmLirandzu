<section class="corridor corridor--video" id="corredor">
  <video class="corridor-video" autoplay muted loop playsinline>
    <source src="video-frota-01.mp4" type="video/mp4">
  </video>
  <div class="corridor-overlay"></div>
  <div class="corridor-content">
    <p class="corridor-eyebrow">{{ 'corridor.eyebrow' | transloco }}</p>
    <h2 class="corridor-title">{{ 'corridor.title' | transloco }}</h2>
    <p class="corridor-desc" [innerHTML]="'corridor.desc' | transloco"></p>
    <div class="corridor-route">
      <span class="route-point">{{ 'corridor.routeFrom' | transloco }}</span>
      <span class="route-arrow">→</span>
      <span class="route-point">{{ 'corridor.routeTo' | transloco }}</span>
    </div>
  </div>
</section>
